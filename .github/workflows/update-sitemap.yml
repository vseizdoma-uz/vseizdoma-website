name: Auto-update sitemap lastmod

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'uz/**/*.html'
      - 'en/**/*.html'
      - 'blog/**/*.html'

permissions:
  contents: write

concurrency:
  group: update-sitemap
  cancel-in-progress: false

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # lastmod двигаем только при изменении содержания: title, description, canonical/hreflang,
      # видимого текста (слова и цифры), alt/src картинок, ссылок в контенте и JSON-LD.
      # Правки стилей, cache-bust, theme-color, эмодзи и знаков препинания дату не меняют.
      # Сравниваются все коммиты пуша (before..HEAD), а не только последний.
      - name: Update lastmod for pages with changed content
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          python3 - <<'EOF'
          import html, os, re, subprocess, datetime

          def show(rev, path):
              r = subprocess.run(["git", "show", f"{rev}:{path}"], capture_output=True, text=True)
              return r.stdout if r.returncode == 0 else None

          def content(doc):
              title = re.search(r"<title>(.*?)</title>", doc, re.S)
              desc = re.search(r'<meta name="description" content="([^"]*)"', doc)
              links = re.findall(r'<link rel="(?:canonical|alternate)"[^>]*>', doc)
              ld = [re.sub(r"\s+", "", x) for x in re.findall(r'<script type="application/ld\+json">(.*?)</script>', doc, re.S)]
              body = re.search(r"<body.*?>(.*)</body>", doc, re.S)
              body = re.sub(r"<(script|style|noscript)\b.*?</\1>", " ", body.group(1) if body else "", flags=re.S)
              attrs = re.findall(r'\b(?:alt|src|srcset|href)="([^"]*)"', body)
              text = re.sub(r"<[^>]+>", " ", body)
              text = re.sub(r"[^\w\s]", " ", html.unescape(text))
              text = re.sub(r"\s+", " ", text).strip()
              return (title.group(1).strip() if title else "", desc.group(1) if desc else "", links, ld, attrs, text)

          before = os.environ.get("BEFORE", "")
          if not before or set(before) == {"0"} or subprocess.run(["git", "cat-file", "-e", before]).returncode:
              before = "HEAD~1"
          changed = subprocess.run(
              ["git", "diff", "--name-only", before, "HEAD", "--", "*.html", "uz/*.html", "en/*.html", "blog/*.html"],
              capture_output=True, text=True).stdout.split()
          today = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=5))).strftime("%Y-%m-%d")
          sitemap = open("sitemap.xml", encoding="utf-8").read()
          updated = 0
          for path in changed:
              old, new = show(before, path), show("HEAD", path)
              if new is None or (old is not None and content(old) == content(new)):
                  print("  content unchanged:", path)
                  continue
              url = "https://vseizdoma.store/" + re.sub(r"(^|/)index\.html$", r"\1", path)
              pattern = re.compile(r"(<loc>" + re.escape(url) + r"</loc>\s*<lastmod>)[0-9-]+(</lastmod>)")
              sitemap, n = pattern.subn(r"\g<1>" + today + r"\g<2>", sitemap)
              if n:
                  updated += 1
                  print("  updated:", url)
          if updated:
              open("sitemap.xml", "w", encoding="utf-8").write(sitemap)
              index = open("sitemap-index.xml", encoding="utf-8").read()
              index = re.sub(r"(<loc>https://vseizdoma\.store/sitemap\.xml</loc>\s*<lastmod>)[0-9-]+", r"\g<1>" + today, index)
              open("sitemap-index.xml", "w", encoding="utf-8").write(index)
          print("pages updated:", updated)
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml sitemap-index.xml
          if git diff --cached --quiet; then
            echo "No sitemap changes to commit"
          else
            git commit -m "chore: auto-update sitemap lastmod [skip ci]"
            git push
          fi
